version: '3.8'

services:
  kantio-conta-api:
    build:
      context: ./contaback
      dockerfile: Dockerfile
    image: kantio-conta-backend:latest
    container_name: kantio-conta-api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://kantio_admin:KantioPostgres2026Master!@kantio-postgres:5432/kantio_contabilidad
      - KANTIO_CORE_URL=http://kantio-core-api:8000
      - SECRET_KEY=kantio_conta_prod_secret_key_2026_super_secure
      - PORT=8000
    ports:
      - "8002:8000"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kantio-conta-api.rule=Host(`contabilidad.kantio.online`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.kantio-conta-api.entrypoints=websecure"
      - "traefik.http.routers.kantio-conta-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kantio-conta-api.loadbalancer.server.port=8000"

  kantio-conta-web:
    build:
      context: ./contafront
      dockerfile: Dockerfile
    image: kantio-conta-frontend:latest
    container_name: kantio-conta-web
    restart: always
    ports:
      - "8082:80"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kantio-conta-web.rule=Host(`contabilidad.kantio.online`)"
      - "traefik.http.routers.kantio-conta-web.entrypoints=websecure"
      - "traefik.http.routers.kantio-conta-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.kantio-conta-web.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
